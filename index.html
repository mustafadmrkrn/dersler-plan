<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ders Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
<meta name="theme-color" content="#070B16">
<style>
/* Düzen: solda menü (telefonda çekmece), sağda içerik. Kayıt formu ders takvimini üretir, takvimde dersler işaretlenir. İki renk (mavi, orman), her biri açık ve koyu görünüm. */
:root{
  --bg:#070B16;--surface:#111A2E;--ink:#EAF0FA;--muted:#8A99B5;--line:#1E2B47;
  --accent:#1FA2F0;--accent-ink:#04121F;--accent-soft:#0F2A44;--warn:#E8B012;--warn-soft:#3A2E08;
  --c1:#1FA2F0;--c2:#7DBA4A;--c3:#E8B012;--c4:#C084FC;
  --display:'Bricolage Grotesque',system-ui,sans-serif;
  --body:'Instrument Sans',system-ui,sans-serif;
  color-scheme:dark;
}
:root[data-pal="mavi"][data-mode="light"]{
  --bg:#F5F7FB;--surface:#FFFFFF;--ink:#0F172A;--muted:#5B6B85;--line:#E1E7F0;
  --accent:#1478D4;--accent-ink:#FFFFFF;--accent-soft:#DCEBFB;--warn:#9A6700;--warn-soft:#FFF1CC;
  --c1:#1478D4;--c2:#3E8E2E;--c3:#C98A00;--c4:#8B3FD1;
  color-scheme:light;
}
:root[data-pal="orman"][data-mode="light"]{
  --bg:#F2F5F1;--surface:#FFFFFF;--ink:#13201B;--muted:#5E6F67;--line:#DCE3DD;
  --accent:#0E7A5C;--accent-ink:#FFFFFF;--accent-soft:#DDF0E8;--warn:#9A5A08;--warn-soft:#FBEBD0;
  --c1:#0E7A5C;--c2:#2D6CDF;--c3:#C98A00;--c4:#B24A8B;
  color-scheme:light;
}
:root[data-pal="orman"][data-mode="dark"]{
  --bg:#0A130F;--surface:#13211B;--ink:#E6F0EA;--muted:#8CA397;--line:#22342B;
  --accent:#2FBF94;--accent-ink:#04140E;--accent-soft:#123327;--warn:#E8B012;--warn-soft:#3A2E08;
  --c1:#2FBF94;--c2:#5B93F0;--c3:#E8B012;--c4:#D77AB8;
  color-scheme:dark;
}
.whenbtn{min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left;font-weight:600}
.whenbtn svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8}
.mcal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.mcal.wd{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase}
.md{min-height:42px;border-radius:99px;font-weight:600}
.md.today{border:1px solid var(--accent)}
.md.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.look{display:flex;flex-direction:column;gap:8px}
.look .row{display:flex;gap:8px;align-items:center}
.modes{display:flex;border:1px solid var(--line);border-radius:99px;overflow:hidden}
.modes button{flex:1;min-height:32px;padding:0 8px;font-size:12px;font-weight:600;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.look select{min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 8px;width:100%}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 var(--body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:26px}
h2{font-size:15px;font-weight:600;letter-spacing:.01em;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

#app{height:100%;display:flex}
aside{width:236px;flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:max(18px,env(safe-area-inset-top)) 12px max(14px,env(safe-area-inset-bottom));gap:18px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;padding:0 10px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:0}
.menu{display:flex;flex-direction:column;gap:4px}
.menu button{display:flex;align-items:center;gap:12px;min-height:48px;padding:0 12px;border-radius:12px;font-weight:600;color:var(--muted);text-align:left}
.menu button svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.menu button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.menu .badge{margin-left:auto;font-size:12px;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 10px}
.sync{font-size:12px;color:var(--muted)}
.sync.err{color:var(--warn)}
.themes{display:flex;gap:8px}
.themes button{width:28px;height:28px;border-radius:99px;border:2px solid var(--line)}
.themes button[aria-pressed="true"]{border-color:var(--ink)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:none;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;border-bottom:1px solid var(--line);background:var(--surface)}
.topbar button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center}
.topbar svg{width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round}
.topbar .ttl{font-family:var(--display);font-weight:700;font-size:20px}
main{flex:1;overflow-y:auto}
.inner{max-width:780px;margin:0 auto;padding:20px 16px 60px;display:flex;flex-direction:column;gap:20px}
.drawer-scrim{display:none}
@media (max-width:859px){
  aside{position:fixed;left:0;top:0;bottom:0;width:80%;max-width:300px;z-index:30;transform:translateX(-102%);transition:transform .2s}
  aside.open{transform:none;box-shadow:8px 0 30px rgba(0,0,0,.35)}
  .topbar{display:flex}
  .drawer-scrim.on{display:block;position:fixed;inset:0;background:rgba(5,12,9,.5);z-index:25}
  .inner{padding-top:16px}
}
@media (prefers-reduced-motion:reduce){aside{transition:none}}

/* Ortak */
.stack{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;width:100%}
.row{display:flex;align-items:center;gap:12px;justify-content:space-between}
.grow{flex:1;min-width:0}
.t1{font-weight:600;overflow-wrap:anywhere}
.t2{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--accent);margin-left:6px;vertical-align:1px}
.tag.off{background:var(--line);color:var(--muted)}
.amt{font-family:var(--display);font-weight:600;white-space:nowrap}
.empty{margin:0;color:var(--muted);font-size:14px}
.btn{min-height:48px;padding:0 18px;border-radius:12px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1px solid var(--line);background:var(--surface)}
.btn.danger{border:1px solid var(--warn);color:var(--warn)}
.btn.block{width:100%}
.chip{min-height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600;display:inline-flex;align-items:center;white-space:nowrap}
.chip.paid{background:var(--accent-soft);color:var(--accent)}
.chip.unpaid{background:var(--warn-soft);color:var(--warn)}
.hero{display:flex;flex-direction:column;gap:6px}
.hero .lab{font-size:13px;font-weight:600;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.hero .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;letter-spacing:-.02em}
.sub{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.sub b{color:var(--ink);font-weight:600}
.meter{height:8px;border-radius:99px;background:var(--warn-soft);overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:99px}
.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left}
.date{width:46px;text-align:center;font-family:var(--display);font-weight:700;line-height:1.1;flex:none}
.date small{display:block;font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}

/* Formlar */
.field{display:flex;flex-direction:column;gap:6px}
.field label,.lbl{font-size:13px;font-weight:600;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=date],.field input[type=time],.field select,.field textarea{min-height:48px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);width:100%;font-size:16px}
.field textarea{padding:10px 12px;min-height:110px;line-height:1.45;resize:vertical}
.field textarea.mono{min-height:160px;font-size:13px;font-family:ui-monospace,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;align-items:center;gap:10px;min-height:48px;font-weight:600}
.sw input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;gap:10px}
.actions .btn{flex:1}
.preview{background:var(--accent-soft);color:var(--accent);border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}

/* Takvim */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav .ml{font-family:var(--display);font-weight:700;font-size:22px;text-align:center;flex:1}
.mnav button.sq{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;padding:2px 0}
.cell{min-height:80px;border-radius:10px;background:var(--surface);border:1px solid var(--line);padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;gap:0;text-align:left;min-width:0;overflow:hidden}
.cell.off{background:transparent;border-color:transparent}
.cell.sel{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.cell .dn{font-size:13px;font-weight:600;width:22px;height:22px;display:inline-flex;align-items:center;justify-content:center;border-radius:99px;margin-bottom:2px}
.cell.today .dn{background:var(--accent);color:var(--accent-ink)}
.ch{display:block;border-radius:4px;margin-top:3px;background:var(--cc);border:1px solid var(--cc);overflow:hidden;color:var(--bg);padding:0 2px;font-size:8.5px;line-height:13px;font-weight:600;letter-spacing:-.1px;white-space:nowrap;text-overflow:ellipsis}
.ch.planned{background:transparent;color:var(--ink)}
.ch.missed{background:transparent;opacity:.4;color:var(--ink);text-decoration:line-through}
.ch .cn{display:inline}
.more{font-size:10px;color:var(--muted);margin-top:2px}
.c1{--cc:var(--c1)}.c2{--cc:var(--c2)}.c3{--cc:var(--c3)}.c4{--cc:var(--c4)}
@media (min-width:640px){
  .cell{min-height:96px;padding:6px}
  .ch{padding:1px 6px;font-size:11px;line-height:1.3}
}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw2{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--cc)}
.sw2.planned{background:transparent;border:1.5px solid var(--muted)}
.dotl{display:inline-block;width:7px;height:7px;border-radius:99px;background:var(--warn)}
.segc{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.link{font-weight:600;text-align:left;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;overflow-wrap:anywhere}
.chip.edit{border:1px solid var(--line);color:var(--muted);background:transparent}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.segc button{min-height:44px;border-radius:10px;border:1px solid var(--line);font-weight:600;font-size:13px;color:var(--muted);padding:0 2px}
.segc button.on.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.segc button.on.missed{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
.segc button.on.planned{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot-c{width:10px;height:10px;border-radius:3px;background:var(--cc);flex:none}
.note{font-size:14px;background:var(--bg);border-radius:10px;padding:8px 10px;white-space:pre-wrap;overflow-wrap:anywhere}

/* Grafik */
svg text{fill:var(--muted);font-family:var(--body);font-size:10px}
svg text.m{font-size:9px}
svg .sel text.m{fill:var(--ink);font-weight:700}
svg text.val{fill:var(--ink);font-weight:700;font-size:11px}
svg .grid{stroke:var(--line);stroke-width:1}
svg .seg{opacity:.65}
svg .sel .seg{opacity:1}
svg .stub{fill:var(--line)}
svg .dot{fill:var(--warn)}
svg .plan{fill:none;stroke:var(--muted);stroke-dasharray:3 2;stroke-width:1.2}
svg .c1 .seg,svg .seg.c1{fill:var(--c1)}svg .seg.c2{fill:var(--c2)}svg .seg.c3{fill:var(--c3)}svg .seg.c4{fill:var(--c4)}
.mrow{display:flex;align-items:center;gap:10px;min-height:44px;padding:0 12px;border-radius:12px;border:1px solid transparent;width:100%;text-align:left}
.mrow.sel{background:var(--surface);border-color:var(--line)}
.mrow .mn{width:62px;font-weight:600;font-size:14px}
.mrow.zero{color:var(--muted)}
.mbar{flex:1;height:10px;background:var(--line);border-radius:99px;overflow:hidden;display:flex}
.mbar i{display:block;height:100%;background:var(--cc)}
.mbar i.acc{--cc:var(--accent)}
svg .seg.pay{fill:var(--accent)}
.bar{display:flex;flex-direction:column;gap:5px}
.bar .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar .track i{display:block;height:100%;background:var(--cc);border-radius:99px}
.ynav{display:flex;align-items:center;gap:10px}
.ynav button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:20px}
.ynav .yl{font-family:var(--display);font-weight:700;font-size:22px;min-width:64px;text-align:center}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat .t2{font-size:12px}
.stat .amt{font-size:18px}

/* Alt sayfa */
.scrim{position:fixed;inset:0;background:rgba(5,12,9,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.sheet{width:100%;max-width:560px;max-height:92%;overflow-y:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:14px}
.sheet h1{font-size:22px}
@media (min-width:640px){.scrim{align-items:center}.sheet{border-radius:20px;max-height:88%}}
#toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:600;z-index:60;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>

    <main id="main"></main>

</div>
<div class="drawer-scrim" id="dscrim" data-act="menuClose"></div>
<div id="sheetRoot"></div>
<div id="toast" role="status"></div>

var trRe=null,trMap=null;
function buildTr(){
  trRe=null;trMap=null;
  var k=['tr','en','de','es'].indexOf(prefs.lang);
  if(k<=0)return;
  trMap={};
  TR_ROWS.forEach(function(r){trMap[r[0]]=r[k]});
  var keys=Object.keys(trMap).sort(function(a,b){return b.length-a.length});
  var esc2=keys.map(function(x){return x.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&')});
  trRe=new RegExp('(^|[^\\p{L}\\p{N}])(?:'+esc2.join('|')+')(?![\\p{L}\\p{N}])','gu');
}
function trText(s){
  if(!trRe||!s||!/[A-Za-zÇĞİÖŞÜçğıöşü]/.test(s))return s;
  var t=s.trim();
  if(trMap[t]!=null)return s.replace(t,trMap[t]);
  return s.replace(trRe,function(m,pre){return pre+trMap[m.slice(pre.length)]});
}
var trBusy=false;
function trNode(root){
  if(!trRe||!root)return;
  trBusy=true;
  try{
    var w=document.createTreeWalker(root.nodeType===1||root.nodeType===11?root:document.body,NodeFilter.SHOW_TEXT,{acceptNode:function(n){
      var p=n.parentNode&&n.parentNode.nodeName;
      return p==='SCRIPT'||p==='STYLE'||p==='TEXTAREA'?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT}});
    var n,list=[];while((n=w.nextNode()))list.push(n);
    list.forEach(function(x){var v=trText(x.nodeValue);if(v!==x.nodeValue)x.nodeValue=v});
    var els=root.nodeType===1?[root].concat([].slice.call(root.querySelectorAll('[aria-label],[placeholder],[title]'))):[].slice.call(document.querySelectorAll('[aria-label],[placeholder],[title]'));
    els.forEach(function(e){['aria-label','placeholder','title'].forEach(function(a){
      var v=e.getAttribute&&e.getAttribute(a);if(v){var t=trText(v);if(t!==v)e.setAttribute(a,t)}})});
    if(document.title&&root===document.body)document.title=trText(document.title);
  }finally{trBusy=false}
}
var trObs=null;
function startTr(){
  buildTr();
  document.documentElement.setAttribute('lang',prefs.lang);
  if(!trObs&&typeof MutationObserver==='function'){
    trObs=new MutationObserver(function(ms){
      if(trBusy||!trRe)return;
      ms.forEach(function(m){
        if(m.type==='characterData'){var v=trText(m.target.nodeValue);if(v!==m.target.nodeValue){trBusy=true;m.target.nodeValue=v;trBusy=false}}
        else m.addedNodes.forEach(function(n){if(n.nodeType===1)trNode(n);else if(n.nodeType===3){var v=trText(n.nodeValue);if(v!==n.nodeValue){trBusy=true;n.nodeValue=v;trBusy=false}}});
      });
    });
    trObs.observe(document.body,{childList:true,subtree:true,characterData:true});
  }
}

function splitTime(o){
  var t=String(o.time||'').trim(),m=/^(\d{1,2})[:.](\d{2})\s*[–—-]\s*(\d{1,2})[:.](\d{2})$/.exec(t),h=/^(\d{1,2})[:.](\d{2})$/.exec(t),p2=function(n){return String(n).padStart(2,'0')};
  if(m){o.time=p2(m[1])+':'+m[2];if(!o.end)o.end=p2(m[3])+':'+m[4]}
  else if(h)o.time=p2(h[1])+':'+h[2];
  if(o.end==null)o.end='';
  return o;
}
function normalize(d){
  var ss=(Array.isArray(d.students)?d.students:[]).map(function(s){
    splitTime(s);
    if(s.cat==='Minecraft')s.cat='Grup';
    if(s.interval==null)s.interval=s.day>=0?1:0;
    return s;
  });
  var ls=(Array.isArray(d.lessons)?d.lessons:[]).map(function(l){
    splitTime(l);
    if(!l.status)l.status='done';
    if(l.note==null)l.note='';
    if(l.topic==null)l.topic='';
    if(l.paid&&!l.paidAt)l.paidAt=l.date;
    if(l.paidAt==null)l.paidAt='';
    return l;
  });
  return {students:ss,lessons:ls,theme:d.theme||'tablo',v:3};
}
function readData(s){
  if(!s)return null;
  try{
    if(typeof s.exists==='function'){if(!s.exists())return null}else if(s.exists===false){return null}
    var d=typeof s.data==='function'?s.data():(s.data!==undefined?s.data:s);
    return d&&Array.isArray(d.students)?d:null;
  }catch(e){return null}
}
function persist(){
  if(backend==='supa'){persistSupa();return}
  if(!ref)return;pending=true;if(!saving)flush()
}
async function flush(){
  saving=true;
  while(pending){
    pending=false;
    try{await ref.set(JSON.parse(JSON.stringify(state)));ui.sync='ok'}catch(e){ui.sync='err'}
  }
  saving=false;renderSync();
}
async function bootDb(){
  try{
    if(typeof claude==='undefined'||!claude.use){ui.sync='local';render();return}
    var timer=new Promise(function(_,rej){setTimeout(function(){rej(new Error('timeout'))},10000)});
    var caps=await Promise.race([Promise.all([claude.use('db'),claude.use('user')]),timer]);
    var db=caps[0],user=caps[1];
    if(!db||!user){ui.sync='local';render();return}
    var id=await user.id();
    var r=db.collection('data/users/'+id).doc('state');
    var snap=await Promise.race([r.get(),timer]);
    var d=readData(snap);
    if(d)state=normalize(JSON.parse(JSON.stringify(d)));
    ref=r;backend='db';ui.sync='ok';render();
  }catch(e){ref=null;ui.err=String(e&&e.message||e);ui.sync='fail';render()}
}

async function aCall(path,body){
  var res=await fetch(SUPA+'/auth/v1/'+path,{method:'POST',headers:{apikey:PUB,'Content-Type':'application/json'},body:JSON.stringify(body)});
  var j={};try{j=await res.json()}catch(e){}
  if(!res.ok)throw new Error(j.msg||j.error_description||j.error||('Hata '+res.status));
  return j;
}
function authMsg(err){
  var m=String(err&&err.message||err),l=m.toLowerCase();
  if(l.indexOf('already registered')>=0||l.indexOf('already been registered')>=0)return 'Bu e-posta zaten kayıtlı. Giriş yap.';
  if(l.indexOf('invalid login')>=0)return 'E-posta ya da şifre yanlış.';
  if(l.indexOf('not confirmed')>=0)return 'E-postanı henüz onaylamadın. Gelen kutundaki bağlantıya tıkla.';
  if(l.indexOf('rate limit')>=0||l.indexOf('too many')>=0)return 'Çok fazla deneme yapıldı. Biraz bekleyip tekrar dene.';
  if(l.indexOf('password')>=0&&l.indexOf('characters')>=0)return 'Şifre en az 8 karakter olmalı.';
  if(l.indexOf('valid email')>=0||l.indexOf('invalid email')>=0)return 'Geçerli bir e-posta yaz.';
  if(l.indexOf('signups not allowed')>=0||l.indexOf('signup is disabled')>=0)return 'Yeni hesap açma şu an kapalı.';
  if(l.indexOf('failed to fetch')>=0||l.indexOf('network')>=0)return 'Bağlantı kurulamadı. İnternetini kontrol et.';
  return m;
}
async function getToken(){
  if(!sess)throw new Error('auth');
  if(Date.now()>sess.exp){
    try{sessSave(await aCall('token?grant_type=refresh_token',{refresh_token:sess.refresh_token}))}
    catch(e){sess=null;try{localStorage.removeItem('dd_sess')}catch(x){}throw new Error('auth')}
  }
  return sess.access_token;
}
async function rest(method,qs,body,prefer){
  var t=await getToken(),ctl=typeof AbortController!=='undefined'?new AbortController():null;
  var to=setTimeout(function(){if(ctl)ctl.abort()},25000);
  try{
    var h={apikey:PUB,Authorization:'Bearer '+t,'Content-Type':'application/json'};
    if(prefer)h.Prefer=prefer;
    var res=await fetch(SUPA+'/rest/v1/ders_state'+qs,{method:method,headers:h,body:body?JSON.stringify(body):undefined,signal:ctl?ctl.signal:undefined});
    if(res.status===401)throw new Error('auth');
    if(!res.ok)throw new Error('Sunucu '+res.status);
    return res.status===204?[]:await res.json();
  }finally{clearTimeout(to)}
}
async function sLoad(){
  var rows=await rest('GET','?select=state,updated_at');
  if(rows.length){state=normalize(rows[0].state);rev=rows[0].updated_at}
  else{rev='';state=emptyState()}
  if(!state.students.length)ui.tab='reg';
  lastLoad=Date.now();ui.sync='ok';cacheSave();
}
async function bootSupa(){
  sess=sessLoad();
  if(!sess){backend='none';ui.sync='local';render();ui.sheet={type:'setup'};renderSheet();return}
  backend='supa';
  state=emptyState();
  var c=cacheLoad();if(c)state=normalize(c);
  ui.sync='wait';render();
  try{await sLoad();render()}
  catch(e){
    if(String(e&&e.message)==='auth'){backend='none';ui.sync='local';render();ui.sheet={type:'setup'};renderSheet();return}
    ui.sync='fail';ui.err=String(e&&e.message||e);render();
  }
}
function persistSupa(){
  if(ui.sync==='fail')return;
  sPending=true;clearTimeout(sTimer);sTimer=setTimeout(sFlush,600);
}
async function sFlush(){
  if(sSaving||ui.sync==='fail')return;
  sSaving=true;
  while(sPending){
    sPending=false;
    try{
      var now=new Date().toISOString(),rows;
      if(rev)rows=await rest('PATCH','?user_id=eq.'+sess.user.id+'&updated_at=eq.'+encodeURIComponent(rev),{state:state,updated_at:now},'return=representation');
      else rows=await rest('POST','?on_conflict=user_id',{user_id:sess.user.id,state:state,updated_at:now},'resolution=ignore-duplicates,return=representation');
      if(rows.length){rev=rows[0].updated_at;ui.sync='ok';cacheSave()}
      else{await sLoad();render();toast('Kayıt başka yerde değişmiş, yenilendi. Son işlemini tekrar yap.')}
    }catch(e){
      if(String(e&&e.message)==='auth'){ui.sync='fail';ui.err='Oturum süresi doldu, yeniden giriş yap';break}
      ui.sync='err';ui.err=String(e&&e.message||e);sPending=true;clearTimeout(sTimer);sTimer=setTimeout(sFlush,15000);break;
    }
  }
  sSaving=false;renderSync();
}

/* ---------- Grafik ---------- */
function monthCats(key){var o={};doneOf(inMonth(key)).forEach(function(l){var c=catOf(l);o[c]=(o[c]||0)+l.fee});return o}
function plannedSum(key){return sum(inMonth(key).filter(function(l){return l.status==='planned'}))}
function legendChart(){return '<div class="legend">'+CATS.map(function(c){return '<span class="'+CATCLS[c]+'"><i class="sw2"></i>'+c+'</span>'}).join('')+'<span><i class="sw2 planned"></i>planlı</span><span><i class="dotl"></i>bekleyen ödeme</span></div>'}
function chart(year,sel){
  var keys=[];for(var i=1;i<=12;i++)keys.push(year+'-'+pad(i));
  var dn=keys.map(function(k){return income(inMonth(k))});
  var pl=keys.map(plannedSum);
  var tot=keys.map(function(k,i){return dn[i]+pl[i]});
  var mx=Math.max.apply(null,tot.concat([1]));
  var step=mx>20000?10000:mx>8000?4000:mx>4000?2000:1000;
  var top=Math.ceil(mx/step)*step;
  var W=360,H=210,L=34,R=8,T=28,B=26,pw=W-L-R,ph=H-T-B,slot=pw/12,bw=slot*0.66;
  var g='<text x="0" y="10">₺ bin</text>';
  [0,0.5,1].forEach(function(f){
    var y=T+ph-ph*f;
    g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+(f?(top*f/1000).toLocaleString(LDATA[prefs.lang].loc,{maximumFractionDigits:1}):'0')+'</text>';
  });
  keys.forEach(function(k,i){
    var x=L+i*slot+(slot-bw)/2,y=T+ph,cats=monthCats(k),isel=k===sel,segs='';
    CATS.forEach(function(c){var v=cats[c]||0;if(!v)return;var hh=ph*v/top;y-=hh;segs+='<rect class="seg '+CATCLS[c]+'" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="2"/>'});
    if(pl[i]){var ph2=ph*pl[i]/top;y-=ph2;segs+='<rect class="plan" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+ph2+'" rx="2"/>'}
    var anchor=i>9?'end':i<2?'start':'middle',tx=anchor==='end'?x+bw:anchor==='start'?x:x+bw/2;
    g+='<g data-act="pickMonth" data-v="'+k+'" class="'+(isel?'sel':'')+'" style="cursor:pointer"><rect x="'+(L+i*slot)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent"/>'+segs+
      (tot[i]?'':'<rect class="stub" x="'+x+'" y="'+(T+ph-2)+'" width="'+bw+'" height="2"/>')+
      (isel&&tot[i]?'<text class="val" x="'+tx+'" y="'+(y-6)+'" text-anchor="'+anchor+'">'+money(dn[i])+'</text>':'')+
      '<text class="m" x="'+(x+bw/2)+'" y="'+(T+ph+13)+'" text-anchor="middle">'+MONTHS[i].slice(0,3)+'</text>'+
      (unpaidOf(inMonth(k)).length?'<circle class="dot" cx="'+(x+bw/2)+'" cy="'+(T+ph+21)+'" r="2.5"/>':'')+'</g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+year+' yılı aylık kazanç grafiği, yıllık toplam '+money(dn.reduce(function(a,b){return a+b},0))+'">'+g+'</svg>';
}

    '<button class="btn ghost block" data-act="csv">Bu ayı Excel için dışa aktar</button></section>';
  return html;

/* ---------- Ödemeler (tahsil edilenler) ---------- */
function paidIn(key){return state.lessons.filter(function(l){return l.paid&&l.paidAt&&l.paidAt.slice(0,7)===key})}
function paidYear(year){return state.lessons.filter(function(l){return l.paid&&l.paidAt&&l.paidAt.slice(0,4)===year})}
function chartPay(year,sel){
  var keys=[];for(var i=1;i<=12;i++)keys.push(year+'-'+pad(i));
  var vs=keys.map(function(k){return sum(paidIn(k))});
  var mx=Math.max.apply(null,vs.concat([1]));
  var step=mx>20000?10000:mx>8000?4000:mx>4000?2000:1000;
  var top=Math.ceil(mx/step)*step;
  var W=360,H=200,L=34,R=8,T=28,B=24,pw=W-L-R,ph=H-T-B,slot=pw/12,bw=slot*0.66;
  var g='<text x="0" y="10">₺ bin</text>';
  [0,0.5,1].forEach(function(f){
    var y=T+ph-ph*f;
    g+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'"/><text x="'+(L-5)+'" y="'+(y+3)+'" text-anchor="end">'+(f?(top*f/1000).toLocaleString(LDATA[prefs.lang].loc,{maximumFractionDigits:1}):'0')+'</text>';
  });
  keys.forEach(function(k,i){
    var x=L+i*slot+(slot-bw)/2,hh=Math.max(ph*vs[i]/top,vs[i]?2:0),y=T+ph-hh,isel=k===sel;
    var anchor=i>9?'end':i<2?'start':'middle',tx=anchor==='end'?x+bw:anchor==='start'?x:x+bw/2;
    g+='<g data-act="pickMonth" data-v="'+k+'" class="'+(isel?'sel':'')+'" style="cursor:pointer"><rect x="'+(L+i*slot)+'" y="0" width="'+slot+'" height="'+H+'" fill="transparent"/>'+
      (vs[i]?'<rect class="seg pay" x="'+x+'" y="'+y+'" width="'+bw+'" height="'+hh+'" rx="2"/>':'<rect class="stub" x="'+x+'" y="'+(T+ph-2)+'" width="'+bw+'" height="2"/>')+
      (isel&&vs[i]?'<text class="val" x="'+tx+'" y="'+(y-6)+'" text-anchor="'+anchor+'">'+money(vs[i])+'</text>':'')+
      '<text class="m" x="'+(x+bw/2)+'" y="'+(T+ph+13)+'" text-anchor="middle">'+MONTHS[i].slice(0,3)+'</text></g>';
  });
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="'+year+' yılında aylara göre tahsil edilen ödemeler, toplam '+money(vs.reduce(function(a,b){return a+b},0))+'">'+g+'</svg>';
}

function viewMoney(){
  var un=unpaidOf(state.lessons),groups={};
  un.forEach(function(l){(groups[l.sid]=groups[l.sid]||[]).push(l)});
  var ids=Object.keys(groups).sort(function(a,b){return sum(groups[b])-sum(groups[a])});
  var html='<div class="hero"><span class="lab">Toplam alacak</span><div class="big num">'+money(sum(un))+'</div><div class="sub num"><span><b>'+un.length+'</b> yapılmış ders ödeme bekliyor</span></div></div>';
  if(!ids.length)return html+'<p class="empty">Bekleyen ödeme yok.</p>';
  html+=ids.map(function(id){
    var s=stById(id),g=groups[id].sort(byDateDesc);
    return '<section class="card"><div class="row"><div class="grow"><div class="t1">'+esc(s?s.name:'Silinmiş kayıt')+'</div><div class="t2 num">'+g.length+' ders</div></div><button class="chip edit" data-act="editStudent" data-id="'+id+'">✎ Düzenle</button><div class="amt num">'+money(sum(g))+'</div></div>'+

      '<button class="btn primary block sm" data-act="payAll" data-id="'+id+'">Hepsi ödendi</button></section>';

function csvText(key,scope){
  var q=function(v){v=String(v);return /[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  var list=scope==='pay'?paidYear(key.slice(0,4)).sort(function(a,b){return a.paidAt<b.paidAt?-1:1}):inMonth(key).sort(function(a,b){return a.date<b.date?-1:1});
  var rows=list.map(function(l){return [trDate(l.date),nameOf(l),STAT[l.status],l.topic,l.note,l.fee,l.paid?'Evet':'Hayır',l.paid&&l.paidAt?trDate(l.paidAt):''].map(q).join(';')});
  return ['Ders tarihi;Öğrenci;Durum;Konu;Yorum;Ücret;Ödendi;Ödeme tarihi'].concat(rows).join('\n');
}

function renderSheet(){

/* ---------- Çizim ---------- */
function renderMain(){

}
function render(){renderSide();renderMain();renderSheet()}

/* ---------- Olaylar ---------- */
function goTab(t){ui.tab=t;ui.menu=false;render();val('main').scrollTop=0}
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,id=b.dataset.id,v=b.dataset.v,l,s;
  switch(act){
    case 'openWhen':ui.sheet={type:'when',date:val('g_start').value,month:val('g_start').value.slice(0,7),time:val('g_time').value,end:val('g_end').value};renderSheet();break;
    case 'whenDay':case 'whenPrev':case 'whenNext':{
      var sw=ui.sheet;sw.time=val('w_time').value;sw.end=val('w_end').value;
      if(act==='whenDay'){sw.date=v;sw.month=v.slice(0,7)}else sw.month=shiftMonth(sw.month,act==='whenNext'?1:-1);
      renderSheet();break;}
    case 'whenSave':{
      var sv=ui.sheet,wt=val('w_time').value,we=val('w_end').value;
      val('g_start').value=sv.date;val('g_time').value=wt;val('g_end').value=we;
      ui.sheet=null;renderSheet();val('g_whenTxt').textContent=whenLabel(sv.date,wt,we);trNode(val('g_whenTxt').parentNode);regPreview();break;}
    case 'scrim':if(e.target===b){ui.sheet=null;renderSheet()}break;
    case 'closeSheet':ui.sheet=null;renderSheet();break;
    case 'menu':ui.menu=true;renderSide();break;
    case 'menuClose':ui.menu=false;renderSide();break;
    case 'tab':goTab(v);break;
    case 'pal':prefs.pal=v;savePrefs();applyLook();renderSide();break;
    case 'mode':prefs.mode=v;savePrefs();applyLook();renderSide();break;
    case 'selDay':ui.sel=v;render();break;
    case 'selOpen':ui.sel=v;ui.cal=v.slice(0,7);goTab('cal');break;
    case 'calPrev':ui.cal=shiftMonth(ui.cal,-1);render();break;
    case 'calNext':ui.cal=shiftMonth(ui.cal,1);render();break;
    case 'calToday':ui.cal=today0.slice(0,7);ui.sel=ds(new Date());render();break;
    case 'status':
      l=lById(id);if(!l||l.status===v)break;
      var was=l.status;l.status=v;persist();
      if(v==='done'&&was!=='done'){ui.sheet={type:'lesson',id:id,focus:'f_topic'}}
      render();
      if(v==='missed')toast("İptal edildi. Geri almak için Planlı düğmesine dokun.");
      break;
    case 'setup':ui.menu=false;renderSide();ui.sheet={type:'setup'};renderSheet();break;
    case 'skipSetup':ui.sheet=null;renderSheet();break;
    case 'login':case 'signup':{
      var em=val('s_mail').value.trim(),pw=val('s_pass').value;
      if(!em||pw.length<8){toast('E-posta ve en az 8 karakterlik şifre yaz');break}
      var isUp=act==='signup';
      toast(isUp?'Hesap oluşturuluyor…':'Giriş yapılıyor…');
      aCall(isUp?'signup':'token?grant_type=password',{email:em,password:pw}).then(function(j){
        if(!j.access_token){toast('Hesap oluşturuldu. E-postana gelen onay bağlantısına tıkla, sonra giriş yap.');return}
        sessSave(j);ui.sheet=null;renderSheet();bootSupa();
      }).catch(function(err){toast(authMsg(err))});
      break;}
    case 'logout':
      try{localStorage.removeItem('dd_sess');localStorage.removeItem(cacheKey())}catch(err){}
      location.reload();break;
    case 'postpone':ui.sheet={type:'postpone',id:id};renderSheet();break;
    case 'ppQuick':val('p_date').value=v;break;
    case 'savePostpone':{
      l=lById(ui.sheet.id);if(!l)break;
      var nd=val('p_date').value,nt=val('p_time').value,ne=val('p_end').value,nfull=nt+(ne?'–'+ne:'');
      if(!nd){toast('Yeni tarihi seç');break}
      if(nd===l.date&&nfull===ltime(l)){toast('Tarih ya da saati değiştir');break}
      l.postponedFrom=l.postponedFrom||l.date;l.date=nd;l.time=nt;l.end=ne;l.status='planned';
      ui.sel=nd;ui.cal=nd.slice(0,7);ui.sheet=null;persist();render();
      toast('Ders '+longDate(nd)+(nt?' '+nfull:'')+' için ertelendi');break;}
    case 'togglePaid':l=lById(id);if(l){l.paid=!l.paid;l.paidAt=l.paid?ds(new Date()):'';persist();render()}break;
    case 'payAll':state.lessons.forEach(function(x){if(x.sid===id&&isDone(x)&&!x.paid){x.paid=true;x.paidAt=ds(new Date())}});persist();render();toast('Hepsi ödendi olarak işaretlendi');break;
    case 'addLesson':ui.sheet={type:'lesson',date:v||ds(new Date())};renderSheet();break;
    case 'editLesson':ui.sheet={type:'lesson',id:id};renderSheet();break;
    case 'editStudent':if(!stById(id)){toast('Bu kayıt silinmiş');break}ui.sheet={type:'student',id:id};renderSheet();break;
    case 'extend':{
      s=stById(id);if(!s)break;
      var mine=state.lessons.filter(function(x){return x.sid===id}).map(function(x){return x.date}).sort();
      var last=mine.length?mine[mine.length-1]:ds(new Date());
      var iv=s.interval===2?2:1,n=parseInt(v,10)||4;
      genDates(addDays(last,7*iv),s.day,iv,n).forEach(function(d){state.lessons.push({id:uid(),sid:id,date:d,topic:'',note:'',fee:s.fee,status:'planned',paid:false})});
      persist();render();toast(n+' ders daha takvime eklendi');break;}
    case 'saveReg':{
      var name=val('g_name').value.trim(),fee=parseInt(val('g_fee').value,10);
      if(!name){toast('Önce bir ad yaz');val('g_name').focus();break}
      if(isNaN(fee)||fee<0){toast('Ücreti rakamla yaz');break}
      var rep=parseInt(val('g_rep').value,10),day=parse(val('g_start').value||ds(new Date())).getDay();
      var count=rep===0?1:Math.min(60,Math.max(1,parseInt(val('g_count').value,10)||1));
      var st={id:uid(),name:name,day:day,time:val('g_time').value,end:val('g_end').value,fee:fee,cat:val('g_cat').value,interval:rep,active:true};
      var dates=genDates(val('g_start').value||ds(new Date()),day,rep===0?1:rep,count);
      state.students.push(st);
      dates.forEach(function(d){state.lessons.push({id:uid(),sid:st.id,date:d,topic:'',note:'',fee:fee,status:'planned',paid:false})});
      ui.cal=dates[0].slice(0,7);ui.sel=dates[0];
      persist();goTab('cal');toast(name+': '+count+' ders takvime eklendi');break;}
    case 'saveStudent':{
      s=stById(ui.sheet.id);if(!s)break;
      var nm=val('e_name').value.trim(),nf=parseInt(val('e_fee').value,10);
      if(!nm){toast('Bir ad yaz');break}
      if(isNaN(nf)||nf<0){toast('Ücreti rakamla yaz');break}
      if(val('e_apply').checked&&nf!==s.fee){state.lessons.forEach(function(x){if(x.sid===s.id&&x.status==='planned')x.fee=nf})}
      s.name=nm;s.fee=nf;s.cat=val('e_cat').value;s.day=parseInt(val('e_day').value,10);s.time=val('e_time').value;s.end=val('e_end').value;s.active=val('e_active').checked;
      ui.sheet=null;persist();render();toast('Kaydedildi');break;}
    case 'deleteStudent':
      if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Silmeyi onayla';break}
      var did=ui.sheet.id;
      state.students=state.students.filter(function(x){return x.id!==did});
      state.lessons=state.lessons.filter(function(x){return x.sid!==did});
      ui.sheet=null;persist();render();toast('Kayıt silindi');break;
    case 'saveLesson':{
      var sid=val('f_sid').value,date=val('f_date').value,lf=parseInt(val('f_fee').value,10);
      if(!sid||!date){toast('Öğrenci ve tarih gerekli');break}
      if(isNaN(lf)||lf<0){toast('Ücreti rakamla yaz');break}
      var data={sid:sid,date:date,status:val('f_status').value,topic:val('f_topic').value.trim(),note:val('f_note').value.trim(),fee:lf,time:val('f_time').value,end:val('f_end').value,paid:val('f_paid').checked,paidAt:''};
      var oldL=ui.sheet.id?lById(ui.sheet.id):null;
      if(data.paid)data.paidAt=val('f_paidAt').value||(oldL&&oldL.paid&&oldL.paidAt)||ds(new Date());
      if(oldL&&oldL.date!==date&&data.status==='planned')data.postponedFrom=oldL.postponedFrom||oldL.date;
      if(ui.sheet.id){Object.assign(lById(ui.sheet.id),data)}else{data.id=uid();state.lessons.push(data)}
      ui.sel=date;ui.cal=date.slice(0,7);
      ui.sheet=null;persist();render();toast('Ders kaydedildi');break;}
    case 'deleteLesson':
      if(!b.dataset.armed){b.dataset.armed='1';b.textContent='Silmeyi onayla';break}
      state.lessons=state.lessons.filter(function(x){return x.id!==ui.sheet.id});
      ui.sheet=null;persist();render();toast('Ders silindi');break;
    case 'pickMonth':ui.month=v;render();break;
    case 'yearPrev':ui.month=(parseInt(ui.month.slice(0,4),10)-1)+ui.month.slice(4);render();break;
    case 'yearNext':ui.month=(parseInt(ui.month.slice(0,4),10)+1)+ui.month.slice(4);render();break;
    case 'csv':ui.sheet={type:'csv',scope:'month'};renderSheet();break;
    case 'csvPay':ui.sheet={type:'csv',scope:'pay'};renderSheet();break;
    case 'copyCsv':{
      var box=val('csvbox');
      try{navigator.clipboard.writeText(box.value).then(function(){toast('Kopyalandı')},function(){box.select();toast('Metin seçildi, elle kopyala')})}
      catch(err){box.select();toast('Metin seçildi, elle kopyala')}
      break;}
  }
});
document.addEventListener('change',function(e){
  var t=e.target;if(!t)return;
  if(t.id==='f_sid'&&ui.sheet&&ui.sheet.type==='lesson'&&!ui.sheet.id){var s=stById(t.value);if(s)val('f_fee').value=s.fee}
  if(t.id==='k_sid'){ui.kSid=t.value;renderMain()}
  if(t.id==='langSel'){prefs.lang=t.value;savePrefs();location.reload()}
});
document.addEventListener('input',function(e){
  var t=e.target;if(t&&ui.tab==='reg'&&t.id&&t.id.indexOf('g_')===0)regPreview();
});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible'||backend!=='supa'||sSaving||sPending||ui.sheet||Date.now()-lastLoad<30000)return;
  sLoad().then(function(){render()}).catch(function(){});
});
applyLook();applyLang();
render();
trNode(document.body);
boot();
})();
</script>
</body>
</html>
